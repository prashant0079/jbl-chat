{% extends "base.html" %}

{% block title %}Users · Jbl-chat{% endblock %}

{% block content %}
<div class="panel">
    <h2 style="display:flex; align-items:center; gap:10px;">All users <span class="status-dot"></span></h2>
    {% if users %}
        <ul style="list-style:none; padding:0; margin:16px 0; display:flex; flex-direction:column; gap:10px;">
            {% for user in users %}
                <li style="display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border:1px solid rgba(148,163,184,0.2); border-radius:12px; background:rgba(255,255,255,0.02);">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span class="status-dot"></span>
                        <div>
                            <div style="font-weight:700; letter-spacing:0.01em;">{{ user.username }}</div>
                            <div style="font-size:13px; color:var(--muted);">ID: {{ user.id }}</div>
                        </div>
                    </div>
                    <a class="btn btn-primary" href="{% url 'chat:conversation_detail' user.id %}">Open chat</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No other users found.</p>
    {% endif %}
</div>
{% endblock %}
