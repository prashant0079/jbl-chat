{% extends "base.html" %}

{% block title %}Login · Jbl-chat{% endblock %}

{% block content %}
<div class="panel" style="max-width: 420px; margin: 0 auto;">
    <h2>Login</h2>
    {% if form.errors %}
        <p style="color:#f87171;">Please check your username/password.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div style="display:flex; flex-direction:column; gap:12px; margin:16px 0;">
            <label>Username<br>{{ form.username }}</label>
            <label>Password<br>{{ form.password }}</label>
        </div>
        <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
    <p style="margin-top:14px; color:var(--muted);">Need an account? <a href="/accounts/signup/">Sign up</a></p>
</div>
{% endblock %}
