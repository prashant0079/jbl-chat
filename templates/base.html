<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Jbl-chat{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #0b1324;
            --panel-strong: #111827;
            --accent: #22c55e;
            --muted: #94a3b8;
            --text: #e2e8f0;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Space Grotesk", "Inter", system-ui, -apple-system, sans-serif;
            font-size: 17px;
            line-height: 1.6;
            background: radial-gradient(circle at 20% 20%, rgba(34, 197, 94, 0.12), transparent 35%),
                        radial-gradient(circle at 80% 0%, rgba(59, 130, 246, 0.12), transparent 35%),
                        var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        header {
            padding: 14px 16px;
            background: linear-gradient(90deg, rgba(17, 24, 39, 0.95), rgba(30, 41, 59, 0.8));
            border-bottom: 1px solid rgba(148, 163, 184, 0.18);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            backdrop-filter: blur(10px);
        }
        header a {
            color: var(--text);
            text-decoration: none;
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        .pill {
            background: rgba(34, 197, 94, 0.15);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        main {
            max-width: 960px;
            margin: 24px auto;
            padding: 0 16px 32px;
        }
        .panel {
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.9), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transition: transform 180ms ease, box-shadow 180ms ease;
        }
        .panel:hover {
            transform: translateY(-2px);
            box-shadow: 0 24px 70px rgba(0,0,0,0.33);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 0.01em;
            transition: transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
        }
        .btn-primary {
            background: linear-gradient(100deg, #22c55e, #16a34a);
            border: none;
            color: #0b1727;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            border-color: rgba(148, 163, 184, 0.6);
        }
        .btn:active {
            transform: translateY(0);
            box-shadow: none;
        }
        textarea, input[type="text"], input[type="password"] {
            width: 100%;
            background: rgba(255,255,255,0.05);
            color: var(--text);
            border: 1px solid rgba(148,163,184,0.28);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 15px;
            resize: vertical;
            transition: border-color 140ms ease, box-shadow 140ms ease;
        }
        textarea::placeholder { color: #cbd5e1; opacity: 0.7; }
        textarea:focus, input:focus {
            outline: none;
            border-color: rgba(34,197,94,0.6);
            box-shadow: 0 0 0 2px rgba(34,197,94,0.15);
        }
        .messages {
            overflow-y: auto;
            padding: 12px;
            border: 1px solid rgba(148,163,184,0.18);
            border-radius: 14px;
            background: rgba(12, 18, 32, 0.8);
            display: flex;
            flex-direction: column;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.15) transparent;
        }
        .messages::-webkit-scrollbar {
            width: 8px;
        }
        .messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.18);
            border-radius: 6px;
        }
        .bubble {
            max-width: 70%;
            padding: 11px 13px;
            border-radius: 14px 14px 14px 8px;
            background: rgba(148,163,184,0.12);
            color: var(--text);
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }
        .bubble.mine {
            margin-left: auto;
            border-radius: 14px 14px 8px 14px;
            background: linear-gradient(120deg, #22c55e, #16a34a);
            color: #0b1727;
        }
        .bubble-meta {
            font-size: 12px;
            opacity: 0.82;
            margin-bottom: 4px;
            color: #cbd5e1;
        }
        .bubble.mine .bubble-meta {
            color: #0b1727;
        }
        a { color: #93c5fd; }
        form .errorlist { color: #f87171; list-style: none; padding: 0; margin: 0 0 8px; }
        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 999px;
            background: #22c55e;
            box-shadow: 0 0 0 4px rgba(34,197,94,0.12);
            display: inline-block;
        }
        @media (max-width: 640px) {
            body { font-size: 15.5px; }
            header { flex-direction: column; align-items: flex-start; gap: 10px; }
            main { padding: 0 12px 24px; }
            .panel { padding: 14px; }
            .messages { max-height: calc(100vh - 230px); }
        }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body>
    <header>
        <a href="/users/">Jbl-chat</a>
        <div>
            {% if request.user.is_authenticated %}
                <span class="pill">{{ request.user.username }}</span>
                <a href="/accounts/logout/" class="btn" style="margin-left:8px;">Logout</a>
            {% else %}
                <a href="/accounts/login/" class="btn">Login</a>
                <a href="/accounts/signup/" class="btn btn-primary" style="margin-left:8px;">Sign up</a>
            {% endif %}
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
        function scrollMessagesToBottom() {
            const el = document.getElementById("messages");
            if (el) {
                el.scrollTop = el.scrollHeight;
            }
        }
        document.addEventListener("DOMContentLoaded", scrollMessagesToBottom);
        if (window.htmx) {
            htmx.on("htmx:afterSwap", scrollMessagesToBottom);
        }
    </script>
    {% block body_extra %}{% endblock %}
</body>
</html>
